name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  integration:
    name: real mongodb ${{ matrix.mongo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Standalone exercises the compensation path; the replica set exercises
        # the transactional one. Both are supported, so both are tested.
        mongo: ['7.0', '8.0']
    services:
      mongo:
        image: mongo:${{ matrix.mongo }}
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm install --no-save mongodb
      - run: npm run test:integration
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
