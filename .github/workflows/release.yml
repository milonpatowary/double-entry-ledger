name: Release

# Publishes to npm when a v* tag is pushed.
#
#   npm version patch   # bumps package.json, commits, creates the tag
#   git push --follow-tags
#
# Publishing from CI rather than a laptop buys three things: the tests that gate
# the release are the same ones CI runs, --provenance produces a real attestation
# (it only does so from a trusted CI environment — the same flag run locally is
# accepted and attests nothing), and no long-lived npm token has to live on
# anyone's machine.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # mint the OIDC token for provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Required for npm to authenticate at publish time, whether that is via
          # OIDC or a token.
          registry-url: 'https://registry.npmjs.org'

      - run: npm install

      # A tag that disagrees with package.json publishes the wrong version under
      # the right name, and npm versions are immutable — so this is checked
      # before anything else runs.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG."
            exit 1
          fi

      # npm would reject a duplicate anyway, but it does so after running
      # everything below. Failing here says why in one line.
      - name: Version must not already exist on npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. npm versions are immutable — bump instead."
            exit 1
          fi
          echo "$NAME@$VERSION is unpublished; continuing."

      - name: Unit tests
        run: npm test

      - name: Integration tests against real MongoDB
        run: |
          npm install --no-save mongodb
          npm run test:integration
        env:
          MONGO_URL: mongodb://127.0.0.1:27017

      # Last look at the tarball in the log, so a release always records what
      # actually shipped.
      - name: Show what will publish
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public
        env:
          # Ignored when npm Trusted Publishing is configured for this package —
          # npm exchanges the OIDC token above instead. Set the NPM_TOKEN secret
          # only if you are not using trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to npm as \`$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")\`.

See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
