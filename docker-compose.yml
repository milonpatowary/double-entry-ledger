# MongoDB for `npm run test:integration`.
#
#   docker compose up -d
#   export MONGO_URL=mongodb://127.0.0.1:27017
#
# Runs as a single-node replica set so transactions are available — that is the
# path the store prefers, and the one worth testing. The library works on a
# standalone mongod too, via the compensation path described in the README.
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    healthcheck:
      test: >-
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
